<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NPB 歴代オーダー編成</title>
<style>
:root{--bg:#f3f6f9;--card:#fff;--ink:#102235;--muted:#647586;--blue:#075ea8;--blue2:#0b83d5;--bluebg:#eaf5ff;--line:#d7e1ea;--red:#c93636;--green:#137d5a;--shadow:0 10px 30px rgba(16,34,53,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
header{background:linear-gradient(120deg,#081d31,#0b4b7c);color:#fff;padding:18px max(14px,calc((100% - 1240px)/2));position:sticky;top:0;z-index:20;box-shadow:0 4px 18px #07192b35}
h1{font-size:22px;margin:0;letter-spacing:.02em}.sub{font-size:12px;opacity:.82;margin-top:4px}.headerrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.progress{background:#ffffff18;border:1px solid #ffffff32;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800;white-space:nowrap}
main{max-width:1240px;margin:auto;padding:14px}.toolbar{display:grid;grid-template-columns:2fr repeat(6,minmax(130px,1fr));gap:8px;margin-bottom:12px;background:#fff;padding:10px;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
.filterfield{display:grid;gap:4px}.filterfield label{font-size:10px;font-weight:800;color:var(--muted);padding-left:3px}.filterfield input,.filterfield select{width:100%;height:42px}
input,select,button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:700;transition:transform .14s ease,box-shadow .14s ease,background-color .14s ease,border-color .14s ease}button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 14px #10283d1c}button:active:not(:disabled){transform:translateY(0);box-shadow:none}button:focus-visible{outline:3px solid #79bff0;outline-offset:2px}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.layout{display:grid;grid-template-columns:minmax(330px,.9fr) minmax(500px,1.35fr);gap:14px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0;box-shadow:var(--shadow)}
h2{font-size:18px;margin:1px 0 4px;display:flex;align-items:center;gap:8px}.sectionhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}.step{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:8px;background:var(--blue);color:#fff;font-size:13px}.hint,.note{font-size:12px;color:var(--muted);line-height:1.55}
.list{display:grid;gap:8px;max-height:720px;overflow:auto;padding-right:3px}.person{display:grid;grid-template-columns:1fr auto;gap:9px;border:1px solid var(--line);border-left:6px solid var(--team-color,#8b949e);border-radius:13px;padding:11px;transition:.15s}.person:hover{box-shadow:0 4px 14px #10283d15;background:#fafdff}.person.used{opacity:.45}.name{font-weight:900;font-size:15px}.meta{font-size:12px;color:var(--muted);line-height:1.55}.person button{padding:8px 11px;background:var(--bluebg);color:var(--blue);border-color:#b9d9f1}.teamtag{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:3px 7px;border:1px solid var(--team-color,#8b949e);border-radius:999px;background:#fff;color:var(--ink);font-size:10px;font-weight:800}.teamdot{width:8px;height:8px;border-radius:50%;background:var(--team-color,#8b949e);flex:none}
.modebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.modebar button.active{background:var(--blue);color:#fff}
.field{position:relative;width:min(100%,540px);aspect-ratio:1.15;border-radius:16px;background:linear-gradient(#cfe6c9,#cfe6c9);border:8px solid #fff;box-shadow:inset 0 0 0 2px #b8c9b5;margin:0 auto 9px;overflow:hidden}
.diamond{position:absolute;width:38%;aspect-ratio:1;left:31%;top:28%;transform:rotate(45deg);border:2px solid #fff;background:#bdd6a9}.base{position:absolute;width:34px;height:34px;background:#fff;border:2px solid #aaa;transform:rotate(45deg);border-radius:3px;display:grid;place-items:center;font-size:10px;font-weight:900}.home{left:calc(50% - 17px);bottom:12%}.second{left:calc(50% - 17px);top:12%}.third{left:11%;top:44%}.first{right:11%;top:44%}
.fpos{position:absolute;min-width:64px;padding:5px 6px;background:#fff;border:1px solid #bfcbd5;border-radius:8px;text-align:center;font-size:9px;box-shadow:0 2px 5px #0001}.fpos strong{display:block;font-size:10px}.p{font-size:9px;color:var(--muted)}
.fp{left:calc(50% - 35px);top:7%}.lp{left:8%;top:17%}.rp{right:8%;top:17%}.ss{left:16%;top:52%}.cf{left:calc(50% - 32px);top:52%}.second.fpos{}.batter{left:calc(50% - 30px);bottom:2%}
.lineup{display:grid;gap:9px}.slot{display:grid;grid-template-columns:40px 1fr auto;gap:11px;align-items:start;border:1px solid var(--line);border-left:6px solid var(--team-color,var(--blue2));border-radius:14px;padding:11px;background:#fff;cursor:grab;box-shadow:0 3px 10px #10283d0a}.slot.empty{border-left-color:#c8d3dc;background:#fafcfd;min-height:65px;align-items:center}.slot.dragging{opacity:.35}.slot.over{outline:2px dashed var(--blue);background:var(--bluebg)}.num{font-weight:900;text-align:center;background:#10283d;color:white;border-radius:10px;padding:8px 0}.lineup .num{touch-action:none;cursor:grab;user-select:none}.lineup .num::after{content:'↕';display:block;font-size:10px;line-height:1;margin-top:3px;opacity:.75}.slotname{font-weight:900;font-size:17px}.slotmeta{font-size:12px;color:var(--muted);line-height:1.55;margin-top:2px}.slotstats{font-size:12px;line-height:1.6;margin-top:7px;padding:7px 9px;background:#f5f8fb;border-radius:9px}.posrow{display:flex;align-items:center;gap:7px;margin-top:7px}.posrow label{font-size:12px;font-weight:800;color:var(--blue)}.posrow select{padding:6px 9px;border-color:#8abce0;background:var(--bluebg);font-weight:800}.remove{color:var(--red);background:#fff;border-color:#e4bfbb;padding:6px 8px}
.tabs{display:flex;gap:5px;margin-bottom:10px;background:#edf2f6;border-radius:12px;padding:4px}.tabs button{flex:1;min-height:39px;border:0;background:transparent;color:var(--muted)}.tabs button:hover{box-shadow:none;background:#ffffff99}.tabs .on{background:#fff;color:var(--blue);box-shadow:0 2px 7px #10283d18}
.badge{display:inline-block;background:var(--bluebg);color:var(--blue);padding:2px 6px;border-radius:99px;font-size:9px;margin-left:4px}.badge.development{background:#fff1d8;color:#8a5700;border:1px solid #e7c67f}
.actions{display:grid;grid-template-columns:minmax(205px,1.2fr) minmax(0,2.6fr);gap:9px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}.actiontools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.actions button{min-height:46px;padding:8px 9px}.actions .randomize{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#7047a8,#503080);color:#fff;border-color:#503080;box-shadow:0 6px 15px #65409b30}.randomize .actionicon{font-size:22px}.randomize .actioncopy{display:grid;text-align:left;line-height:1.15}.randomize small{font-size:9px;font-weight:600;opacity:.82;margin-top:3px}.actions .savebtn{background:var(--blue);color:#fff;border-color:var(--blue)}.actions .loadbtn{color:var(--blue);border-color:#9cc6e4;background:#f4faff}.actions .xshare{background:#111;color:#fff;border-color:#111}.actions .image-save{background:#137d5a;color:#fff;border-color:#137d5a}.actions .resetbtn{color:var(--red);background:#fff;border-color:#e4bfbb}.actions button:disabled{opacity:.5;cursor:wait;box-shadow:none}.statusbox{font-size:12px;border-radius:10px;padding:8px 10px;margin-bottom:9px;background:#eef8f3;color:var(--green);font-weight:700}.statusbox.warn{background:#fff4e5;color:#9a5a00}
.birthrange{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}.birthclear{padding:7px 9px;color:var(--blue);background:var(--bluebg);border-color:#b9d9f1}.pitcherbox{margin:0 0 10px;padding:10px;border:1px solid #b9d9f1;border-radius:13px;background:#f4faff}.pitcherbox[hidden]{display:none}.pitcherhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}.pitcherhead b{color:var(--blue)}.pitcherhint{font-size:11px;color:var(--muted)}.addbuttons{display:flex;gap:5px;align-self:center}.addbuttons button{padding:8px 9px}.addbuttons .pitchbtn{background:#fff7e8;color:#8b5700;border-color:#ead09a}
@media(max-width:1100px){.toolbar{grid-template-columns:repeat(4,1fr)}.filter-search{grid-column:span 2}}@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.filter-search{grid-column:1/-1}.layout{grid-template-columns:1fr}.list{max-height:420px}}
@media(max-width:700px){.actions{grid-template-columns:1fr}.actiontools{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){header{padding:13px 10px}h1{font-size:18px}.sub{font-size:11px}.progress{font-size:11px;padding:6px 8px}main{padding:7px}.toolbar{grid-template-columns:1fr;padding:8px}.toolbar input{grid-column:auto}.panel{padding:10px;border-radius:14px}.slot{grid-template-columns:34px 1fr auto;padding:9px}.slotname{font-size:16px}.actions{position:sticky;bottom:6px;z-index:12;grid-template-columns:1fr;background:#fff;padding:8px;border:1px solid var(--line);border-radius:14px;box-shadow:0 -5px 20px #10283d1c}.actions .randomize{min-height:48px}.actiontools{grid-template-columns:repeat(3,1fr)}.actiontools button{min-height:40px;padding:7px 5px;font-size:12px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style></head>
<body>
<header><div class="headerrow"><div><h1>⚾ NPB 歴代オーダー編成</h1><div class="sub">歴代選手から、打順と守備を自由に組み立てる</div></div><div id="progress" class="progress">0 / 9人</div></div></header>
<main>
<div class="toolbar">
<div class="filterfield filter-search"><label for="q">キーワード</label><input id="q" placeholder="選手名・読み・球団・守備位置"></div>
<div class="filterfield"><label for="team">所属球団</label><select id="team"><option value="">すべての球団</option></select></div>
<div class="filterfield"><label for="pos">守備位置</label><select id="pos"><option value="">すべて</option><option>投手</option><option>捕手</option><option>一塁手</option><option>二塁手</option><option>三塁手</option><option>遊撃手</option><option>外野手</option><option>指名打者</option></select></div>
<div class="filterfield"><label for="status">選手区分</label><select id="status"><option value="">現役・OBすべて</option><option value="active">現役すべて</option><option value="controlled">現役（支配下）</option><option value="development">現役（育成）</option><option value="overseas">現役（海外）</option><option value="ob">OB</option></select></div>
<div class="filterfield"><label>生年月日（範囲）</label><div class="birthrange"><input id="birthFrom" type="date" aria-label="生年月日の開始日"><input id="birthTo" type="date" aria-label="生年月日の終了日"><button type="button" class="birthclear" onclick="clearBirth()">クリア</button></div></div>
<div class="filterfield"><label for="dh">編成方式</label><select id="dh"><option value="dh">DH制：あり</option><option value="nodh">DH制：なし</option></select></div>
</div>
<div class="layout">
<section class="panel">
<div class="sectionhead"><div><h2><span class="step">1</span>選手を探す <span id="count" class="badge"></span></h2><div class="hint">名前・読み・球団・守備位置から検索</div></div></div>
<div id="list" class="list"></div>
</section>
<section class="panel">
<div class="sectionhead"><div><h2><span class="step">2</span>オーダーを組む</h2><div class="hint">ドラッグで打順変更・各選手の守備位置を選択</div></div></div>
<div class="tabs"><button id="npbtab" class="on" onclick="setStats('npb')">NPB通算</button><button id="mlbtab" onclick="setStats('mlb')">MLB通算</button><button id="alltab" onclick="setStats('all')">日米成績</button></div>
<div id="lineupStatus" class="statusbox warn">選手を選んでオーダーを完成させましょう</div>
<div id="pitcherBox" class="pitcherbox" hidden><div class="pitcherhead"><b>先発投手（打順外）</b><span class="pitcherhint">投手カードの「投手枠へ」で設定</span></div><div id="pitcherSlot"></div></div>
<div id="lineup" class="lineup"></div>
<div class="actions"><button id="randomButton" class="randomize" onclick="randomLineup()" disabled><span class="actionicon">🎲</span><span class="actioncopy"><b>ランダム編成</b><small>守備位置に合わせて自動選出</small></span></button><div class="actiontools"><button class="savebtn" onclick="save()" title="現在の編成を保存">💾 保存</button><button class="loadbtn" onclick="load()" title="保存した編成を読み込む">↩ 読込</button><button class="xshare" onclick="shareX()" title="Xに編成を共有">𝕏 共有</button><button class="image-save" onclick="saveImage()" title="編成をPNG画像で保存">▣ 画像</button><button class="resetbtn" onclick="resetAll()" title="編成をリセット">リセット</button></div></div>
</section></div><p class="note" style="text-align:center;margin:12px 0">通算成績：2025年シーズン終了時点／現役・現在所属・支配下／育成区分：NPB・MLB公式情報を基準に2026年9月4日現在</p></main>

function clearDragStyles(){document.querySelectorAll('.slot.dragging,.slot.over').forEach(el=>el.classList.remove('dragging','over'))}
function startDrag(e,i,el){if(!order[i])return e.preventDefault();dragIndex=i;el.classList.add('dragging');if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(i))}}
function dragOver(e,el){e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='move';el.classList.add('over')}
function endDrag(){clearDragStyles();dragIndex=null}
function dropAt(e,i){e.preventDefault();let from=dragIndex;if(e.dataTransfer){const value=e.dataTransfer.getData('text/plain');if(value!=='')from=Number(value)}clearDragStyles();dragIndex=null;if(Number.isInteger(from)&&from!==i)swap(from,i)}
function touchStart(e,i){if(!order[i])return;touchFrom=i;touchTo=i;e.currentTarget.closest('.slot').classList.add('dragging')}
function touchMove(e){if(touchFrom===null)return;e.preventDefault();const t=e.touches[0],el=document.elementFromPoint(t.clientX,t.clientY)?.closest('.slot[data-order-index]');document.querySelectorAll('.slot.over').forEach(x=>x.classList.remove('over'));if(el){touchTo=Number(el.dataset.orderIndex);el.classList.add('over')}}
function touchEnd(){if(touchFrom===null)return;const from=touchFrom,to=touchTo;touchFrom=touchTo=null;clearDragStyles();if(Number.isInteger(to)&&from!==to)swap(from,to)}
function setPosition(i,value){if(pitcher?.id===order[i]?.id&&value!=='指名打者')return alert('投手枠と打順で同じ選手を使う場合、打順側は指名打者に設定してください。');defense[i]=value;render()}
function statText(p,role='batting'){
 const key=role==='pitching'?'pitching':'batting',label=role==='pitching'?'投手成績':'打撃成績';
 const npb=p['npb_'+key]||`${label}なし`;
 if(statMode==='npb')return `<b>NPB通算</b><br>${npb}`;
 const mlb=p['mlb_'+key]||'';
 if(statMode==='mlb')return mlb?`<b>MLB通算</b><br>${mlb}`:`<b>MLB通算</b><br>${label}なし`;
 return `<b>NPB ${label}</b> ${npb}<br><b>MLB ${label}</b> ${mlb||'記録なし'}`;
}
function lineupRole(i){return $('dh').value==='nodh'&&defense[i]==='投手'?'pitching':'batting'}
function positionSelect(p,i){return eligiblePositions(p).map(pos=>`<option ${defense[i]===pos?'selected':''}>${pos}</option>`).join('')}
function updateStatus(){const filled=order.filter(Boolean).length,dh=$('dh').value==='dh';$('progress').textContent=dh?`${filled} / 9人＋投手`:`${filled} / 9人`;const expected=dh?['捕手','一塁手','二塁手','三塁手','遊撃手','左翼手','中堅手','右翼手','指名打者']:['投手','捕手','一塁手','二塁手','三塁手','遊撃手','左翼手','中堅手','右翼手'];const chosen=defense.filter(Boolean),duplicate=chosen.find((x,i)=>chosen.indexOf(x)!==i),missing=expected.filter(x=>!chosen.includes(x));const box=$('lineupStatus');if(filled===9&&!duplicate&&!missing.length&&(!dh||pitcher)){box.className='statusbox';box.textContent='✓ オーダー完成　打順と守備位置が設定されています'}else{box.className='statusbox warn';box.textContent=duplicate?`守備位置「${duplicate}」が重複しています`:filled<9?`あと${9-filled}人を打順に追加してください`:missing.length?`未設定の守備：${missing.join('・')}`:'DH制の先発投手を設定してください'}}
function render(){
 const dh=$('dh').value==='dh';$('pitcherBox').hidden=!dh;$('pitcherSlot').innerHTML=pitcher?`<div class="slot" style="--team-color:${visualColor(pitcher)}"><div class=num>P</div><div><div class=slotname>${pitcher.name}${rosterBadge(pitcher)}${inOrder(pitcher)?'<span class=badge>投手兼DH</span>':''}</div><span class=teamtag><span class=teamdot></span>${teamLabel(pitcher)}</span><div class=slotmeta>${positionMeta(pitcher)}　${pitcher.throws}投${pitcher.bats}打<br>${profileMeta(pitcher)}<br>歴代所属：${canonicalHistory(pitcher).join(' → ')}</div><div class=slotstats>${statText(pitcher,'pitching')}</div></div><button class=remove onclick="removePitcher()" aria-label="${pitcher.name}を投手枠から削除">×</button></div>`:'<div class=hint>選手一覧から投手を選び、「投手枠へ」を押してください。投手をDHとして打順にも登録できます。</div>';
 $('lineup').innerHTML=order.map((p,i)=>`<div class="slot ${p?'':'empty'}" data-order-index="${i}" style="--team-color:${p?visualColor(p):'#c8d3dc'}" draggable="${!!p}" ondragstart="startDrag(event,${i},this)" ondragend="endDrag()" ondragover="dragOver(event,this)" ondragleave="this.classList.remove('over')" ondrop="dropAt(event,${i})"><div class=num title="ドラッグして打順変更" ontouchstart="touchStart(event,${i})">${i+1}</div><div>${p?`<div class=slotname>${p.name}${rosterBadge(p)}${p.mlb_batting||p.mlb_pitching?'<span class=badge>MLB経験</span>':''}${pitcher?.id===p.id?'<span class=badge>投手兼DH</span>':''}</div><span class=teamtag><span class=teamdot></span>${teamLabel(p)}</span><div class=slotmeta>${readingLabel(p)}　${p.throws}投${p.bats}打<br>${positionMeta(p)}<br>${profileMeta(p)}<br>歴代所属：${canonicalHistory(p).join(' → ')}</div><div class=posrow><label>守備位置</label><select onchange="setPosition(${i},this.value)" onclick="event.stopPropagation()">${positionSelect(p,i)}</select></div><div class=slotstats>${statText(p,lineupRole(i))}</div>`:'<div><b>選手未選択</b><div class=hint>左の一覧から選手を追加</div></div>'}</div>${p?`<button class=remove onclick="remove(${i})" aria-label="${p.name}を削除">×</button>`:''}</div>`).join('');
 updateStatus();renderList()
}
function show(id){selectedId=id}
function setStats(mode){statMode=mode;$('npbtab').classList.toggle('on',mode==='npb');$('mlbtab').classList.toggle('on',mode==='mlb');$('alltab').classList.toggle('on',mode==='all');render()}
function save(){localStorage.setItem('npb-order-v5',JSON.stringify({ids:order.map(p=>p?.id||null),defense,pitcherId:pitcher?.id||null,dh:$('dh').value}));alert('オーダーを保存しました。')}
function shareText(){const rows=order.map((p,i)=>p?`${i+1}. ${p.name}（${defense[i]||'守備未設定'}）`:null).filter(Boolean);if($('dh').value==='dh'&&pitcher)rows.push(`P. ${pitcher.name}`);return `私のNPB歴代オーダー\n${rows.join('\n')}\n#NPB歴代オーダー`}
function shareX(){if(!order.some(Boolean))return alert('共有する選手を打順に追加してください。');const url=`https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(location.href)}`;window.open(url,'_blank','noopener,noreferrer')}
function plainStats(p,role){const key=role==='pitching'?'pitching':'batting',label=role==='pitching'?'投手成績':'打撃成績',npb=p['npb_'+key]||`${label}なし`,mlb=p['mlb_'+key]||'';return statMode==='npb'?`NPB通算：${npb}`:statMode==='mlb'?`MLB通算：${mlb||label+'なし'}`:`NPB：${npb}　MLB：${mlb||'記録なし'}`}
function fitText(ctx,text,max){if(ctx.measureText(text).width<=max)return text;let s=text;while(s.length&&ctx.measureText(s+'…').width>max)s=s.slice(0,-1);return s+'…'}
function saveImage(){
 if(!order.some(Boolean))return alert('画像にする選手を打順に追加してください。');
 const rows=9+($('dh').value==='dh'?1:0),w=1200,h=210+rows*104+70,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 x.fillStyle='#eef3f7';x.fillRect(0,0,w,h);x.fillStyle='#0b3455';x.fillRect(0,0,w,150);x.fillStyle='#fff';x.font='bold 42px "Noto Sans JP","Yu Gothic",sans-serif';x.fillText('NPB 歴代オーダー',54,65);x.font='24px "Noto Sans JP","Yu Gothic",sans-serif';x.fillText(`${$('dh').value==='dh'?'DH制':'DHなし'} ／ ${statMode==='npb'?'NPB通算':statMode==='mlb'?'MLB通算':'日米成績'}`,54,110);
 const draw=(p,label,pos,y,role)=>{x.fillStyle='#fff';x.fillRect(42,y,w-84,88);x.fillStyle=p?visualColor(p):'#c8d3dc';x.fillRect(42,y,10,88);x.fillStyle='#102235';x.font='bold 27px "Noto Sans JP","Yu Gothic",sans-serif';x.fillText(label,70,y+37);x.font='bold 29px "Noto Sans JP","Yu Gothic",sans-serif';x.fillText(p?p.name:'選手未選択',135,y+37);x.font='bold 20px "Noto Sans JP","Yu Gothic",sans-serif';x.fillText(pos||'—',540,y+36);x.font='18px "Noto Sans JP","Yu Gothic",sans-serif';if(p){x.fillStyle='#526477';x.fillText(fitText(x,teamLabel(p),540),135,y+69);x.fillText(fitText(x,plainStats(p,role),530),540,y+68)}};
 order.forEach((p,i)=>draw(p,String(i+1),defense[i],170+i*104,lineupRole(i)));if($('dh').value==='dh')draw(pitcher,'P','投手',170+9*104,'pitching');
 x.fillStyle='#647586';x.font='16px "Noto Sans JP","Yu Gothic",sans-serif';x.fillText('NPB歴代オーダー編成',42,h-25);
 c.toBlob(blob=>{if(!blob)return window.open(c.toDataURL('image/png'),'_blank');const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`npb-order-${new Date().toISOString().slice(0,10).replaceAll('-','')}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png');
}
function load(){let saved=JSON.parse(localStorage.getItem('npb-order-v5')||localStorage.getItem('npb-order-v4')||'null'),ids;if(saved){ids=saved.ids;defense=[...saved.defense];if(saved.dh)$('dh').value=saved.dh;pitcher=saved.pitcherId?players.find(p=>p.id===saved.pitcherId)||null:null}else{ids=JSON.parse(localStorage.getItem('npb-order-v3')||'null')}if(!ids)return alert('保存データがありません。');for(let i=0;i<9;i++){const legacy=curatedPlayers.find(p=>p.id===ids[i]);order[i]=ids[i]?(players.find(p=>p.id===ids[i])||players.find(p=>legacy&&p.name===legacy.name)||null):null;if(!defense[i]&&order[i])defense[i]=defaultPosition(order[i])}render()}
function resetAll(){if(confirm('オーダーをリセットしますか？')){order.fill(null);defense.fill('');pitcher=null;selectedId=null;render()}}
['q','team','pos','status','birthFrom','birthTo'].forEach(id=>$(id).addEventListener('input',render));
$('dh').addEventListener('input',()=>{if($('dh').value==='nodh')pitcher=null;defense=defense.map((x,i)=>(x==='指名打者'||x==='投手')?(order[i]?defaultPosition(order[i]):''):x);render()});
document.addEventListener('touchmove',touchMove,{passive:false});
document.addEventListener('touchend',touchEnd);
document.addEventListener('touchcancel',touchEnd);
render();
fetch('npb_players_full.json').then(r=>{if(!r.ok)throw new Error('data');return r.json()}).then(data=>{
 const curatedByName=Object.fromEntries(curatedPlayers.map(p=>[p.name,p]));
 players=data.players.map(p=>{const c=curatedByName[p.name];return c?{...p,throws:p.throws==='—'?c.throws:p.throws,bats:p.bats==='—'?c.bats:p.bats}:p});
 dataReady=true;$('randomButton').disabled=false;
 render();
}).catch(()=>{$('count').textContent=players.length+'人（簡易版）'});
</script></body></html>
